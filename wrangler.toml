name = "synchronicle"
main = "worker/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# D1：用户/渠道/额度/审计/举报 + kv_files 书稿内容表
[[d1_databases]]
binding = "DB"
database_name = "synchronicle"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# RuntimeHub Durable Object：每 userId:bookId 一个实例，承载 SSE 与运行事件回放
[durable_objects]
bindings = [{ name = "RUNTIME", class_name = "RuntimeHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuntimeHub"]

# R2（可选）：导出文件存储；未绑定时 /api/export 返回内联文本
# [[r2_buckets]]
# binding = "EXPORTS"
# bucket_name = "synchronicle-exports"

# KV：可选缓存命名空间（当前切片未强制使用）
# [[kv_namespaces]]
# binding = "CONTENT"
# id = "REPLACE_WITH_KV_ID"

[vars]
# MODE = "commercial"

# 机密：wrangler secret put MASTER_KEY  # openssl rand -hex 32
