services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synchronicle
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: synchronicle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synchronicle"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MODE: commercial
      DATABASE_URL: postgres://synchronicle:change-me@db:5432/synchronicle
      MASTER_KEY: ${MASTER_KEY:?请设置 MASTER_KEY（openssl rand -hex 32）}
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  appdata:
